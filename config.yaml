# Config layers (see docs/ONBOARDING.md):
#   1) config.yaml          — shared install defaults (this file)
#   2) config.local.yaml    — machine overrides (gitignored); deep-merged
#   3) data/state/*         — Admin/runtime overrides (defaults, modules, secrets)
# Module capability SoT is catalog/catalog.yaml + catalog/providers/*.yaml
# (agents / TTS / STT / pets). Do not duplicate full provider recipes here.

server:
  host: "0.0.0.0"
  port: 8765
  assets_port: 8766     # HTTP pet packs (GET /pets/...)

network:
  advertise_url: null   # e.g. "ws://100.x.y.z:8765"
  assets_url: null      # optional override, e.g. "http://100.x.y.z:8766/pets"

# Unified paths (layout v2). home=null → <repo>/data (gitignore).
# Override with AGENTDOCK_HOME or an absolute paths.home for OS user data dirs.
paths:
  home: null
  vault: "vault"
  state: "state"
  logs: "logs"
  installs: "installs"
  cache: "cache"
  sessions: "sessions"
  secrets: "secrets"
  pets: null          # null → <repo>/assets/pets
  voices: null        # null → <repo>/assets/voices
  catalog: "catalog/catalog.yaml"

# Speech recognition — ON by default (CPU-safe for any machine).
# For NVIDIA GPU: copy config.cuda.example.yaml → config.local.yaml (or merge by hand).
stt:
  provider: "whisper"
  warm: true              # preload Whisper weights
  defer_warm: true        # open :8765 while model loads in background
  whisper:
    model: "small"          # portable default; use medium+cuda via config.local.yaml
    device: "cpu"           # auto-falls back from cuda if GPU init fails
    language: "zh"
    beam_size: 5            # 提高准确率（比 1 慢一点）；1 可加快推理
    vad_filter: true
    code_switch: false
    # 领域提示：减少「技能/智能」等同音误识
    initial_prompt: "这是中文语音对话。常见词：技能、智能助手、编程、代码、Markdown、Agent、工具。"

# Session history sent to agents (sliding window)
session:
  max_context: 40

# TTS engines live in the module catalog. Character packs under assets/voices/<id>/
# with voice.yaml are registered automatically — do not list them here.
tts:
  default: "edge"
  warm: true                # pre-switch SoVITS weights after Runtime starts
  providers:
    edge:
      type: "edge"
      name: "Edge TTS"
      voice: "zh-CN-XiaoxiaoNeural"
      models:
        - "zh-CN-XiaoxiaoNeural"
        - "zh-CN-YunxiNeural"
        - "zh-CN-XiaoyiNeural"
        - "en-US-JennyNeural"

agent:
  default: "pi"
  # Built-in Pi gateway (agents/pi-coding). Remote Agent Protocol URLs are advanced-only.

security:
  # Exposed binds (0.0.0.0) auto-require a token stored in data/state/device-auth.json
  # when tokens is empty. Set require_token: false only for loopback-only Device binds.
  require_token: true
  tokens: []

# Sidecar processes (shown on overview; start via module buttons)
services:
  pi:
    port: 9001
    # First-boot npm install is automatic; set true to also spawn the gateway with Runtime.
    autostart: false
  sovits:
    port: 9880
    autostart: false
    # 本机包：data/installs/GPT-SoVITS/；或 docker compose --profile engines（见 docs/DEPLOY.md）。
  playwright-mcp:
    port: 8931
    # 首轮对话会 ensure；设 true 可在 Runtime 启动时就拉起（需已配置扩展 token）
    autostart: false

# Optional installer overrides (catalog path lives under paths.catalog).
modules:
  # proxy: "http://127.0.0.1:7890"  # optional installer HTTP/HTTPS proxy

health:
  interval_seconds: 3
