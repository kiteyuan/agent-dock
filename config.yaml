server:
  host: "0.0.0.0"
  port: 8765
  assets_port: 8766     # HTTP pet packs (GET /pets/...)

network:
  advertise_url: null   # e.g. "ws://100.x.y.z:8765"
  assets_url: null      # optional override, e.g. "http://100.x.y.z:8766/pets"

# Unified paths (layout v2). home=null → <repo>/data (gitignore).
# Override with AGENTDOCK_HOME or an absolute paths.home for OS user data dirs.
paths:
  home: null
  vault: "vault"
  state: "state"
  logs: "logs"
  installs: "installs"
  cache: "cache"
  sessions: "sessions"
  secrets: "secrets"
  pets: null          # null → <repo>/assets/pets
  voices: null        # null → <repo>/assets/voices
  catalog: "catalog/catalog.yaml"

# Speech recognition — ON by default
stt:
  provider: "whisper"
  warm: true              # preload Whisper weights
  defer_warm: true        # open :8765 while model loads in background
  whisper:
    model: "medium"         # medium 中文明显稳过 small；3080 仍可亚秒~2s
    device: "cuda"
    language: "zh"
    beam_size: 5            # 提高准确率（比 1 慢一点）；1 可加快推理
    vad_filter: true
    code_switch: false
    # 领域提示：减少「技能/智能」等同音误识
    initial_prompt: "这是中文语音对话。常见词：技能、智能助手、编程、代码、Markdown、Agent、工具。"

# Session history sent to agents (sliding window)
session:
  max_context: 40

# TTS engines live in the module catalog. Character packs under assets/voices/<id>/
# with voice.yaml are registered automatically — do not list them here.
tts:
  default: "edge"
  warm: true                # pre-switch SoVITS weights after Runtime starts
  providers:
    edge:
      type: "edge"
      name: "Edge TTS"
      voice: "zh-CN-XiaoxiaoNeural"
      models:
        - "zh-CN-XiaoxiaoNeural"
        - "zh-CN-YunxiNeural"
        - "zh-CN-XiaoyiNeural"
        - "en-US-JennyNeural"

agent:
  default: "pi"
  # 本机助手地址来自 catalog/providers/agents.yaml 的 sidecar 端口。
  # 只有 Docker 这类远程主机才需要在这里写 url。

security:
  # Exposed binds (0.0.0.0 / Docker) auto-require a token stored in data/state/device-auth.json
  # when tokens is empty. Set require_token: false only for loopback-only Device binds.
  require_token: true
  tokens: []

# Sidecar processes (shown on overview; start via module buttons)
services:
  pi:
    port: 9001
    autostart: false
  codex:
    port: 9002
    autostart: false
  claude:
    port: 9003
    autostart: false
  sovits:
    port: 9880
    autostart: false
    # 整合包解压到 data/vault/GPT-SoVITS/，再在管理页点「检查安装」。

# Optional installer overrides (catalog path lives under paths.catalog).
modules:
  # proxy: "http://127.0.0.1:7890"  # optional installer HTTP/HTTPS proxy

health:
  interval_seconds: 3
