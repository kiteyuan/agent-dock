server:
  host: "0.0.0.0"
  port: 8765
  assets_port: 8766     # HTTP pet packs (GET /pets/...)

network:
  advertise_url: null   # e.g. "ws://100.x.y.z:8765"
  assets_url: null      # optional override, e.g. "http://100.x.y.z:8766/pets"

# Host-side pet packs — clients download + cache after pets.list
pets:
  root: "pets"

# Shared Agent working directory (absolute, or relative to repo root).
# Runtime sends this as AgentRequest.workspace to every agent turn.
workspace:
  root: "workspace"

# Speech recognition — ON by default
stt:
  provider: "whisper"
  warm: true              # preload Whisper weights
  defer_warm: true        # open :8765 while model loads in background
  whisper:
    model: "medium"         # medium 中文明显稳过 small；3080 仍可亚秒~2s
    device: "cuda"
    language: "zh"
    beam_size: 5            # 提高准确率（比 1 慢一点）；1 可加快推理
    vad_filter: true
    code_switch: false
    # 领域提示：减少「技能/智能」等同音误识
    initial_prompt: "这是中文语音对话。常见词：技能、智能助手、编程、代码、Markdown、Agent、工具。"

# Session history sent to agents (sliding window)
session:
  max_context: 40

# TTS engines live in the module catalog. Character packs under voices/<id>/
# with voice.yaml are registered automatically — do not list them here.
tts:
  default: "edge"
  warm: true                # pre-switch SoVITS weights after Runtime starts
  providers:
    edge:
      type: "edge"
      name: "Edge TTS"
      voice: "zh-CN-XiaoxiaoNeural"
      models:
        - "zh-CN-XiaoxiaoNeural"
        - "zh-CN-YunxiNeural"
        - "zh-CN-XiaoyiNeural"
        - "en-US-JennyNeural"

agent:
  default: "pi"
  # 本机助手地址来自 modules/providers/agents.yaml 的 sidecar 端口。
  # 只有 Docker 这类远程主机才需要在这里写 url。

security:
  require_token: false
  tokens: []

# Sidecar processes (shown on overview; start via module buttons)
services:
  pi:
    port: 9001
    autostart: false
  codex:
    port: 9002
    autostart: false
  claude:
    port: 9003
    autostart: false
  sovits:
    port: 9880
    autostart: false
    # 整合包解压到 workspace/GPT-SoVITS/，再在管理页点「检查安装」。
  web:
    port: 8090
    autostart: false

# 内置能力、探针和启动配方集中在声明式目录；这里只覆盖部署参数。
modules:
  catalog: "modules/catalog.yaml"
  # proxy: "http://127.0.0.1:7890"  # optional installer HTTP/HTTPS proxy

health:
  interval_seconds: 3
