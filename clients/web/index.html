<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>AgentDock</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./icon-128.png" />
  <meta name="theme-color" content="#141414" />
  <link rel="stylesheet" href="./styles.css?v=13" />
</head>
<body>
  <div class="stage" id="stage" data-mood="offline">
    <div class="stack">
      <div class="bot-block">
        <div class="status-badge" id="statusBadge" aria-hidden="true">
          <span class="ico"></span>
        </div>
        <button type="button" id="bot" class="bot" aria-label="通话，长按打开设置">
          <div class="sprite-wrap">
            <canvas id="sprite" class="sprite" width="192" height="208" aria-hidden="true"></canvas>
          </div>
        </button>
      </div>

      <div class="reply-box" id="replyBox" aria-live="polite" title="">
        <p id="reply" class="reply"></p>
        <span id="caret" class="caret"></span>
      </div>
    </div>
  </div>

  <div id="composer" class="composer" hidden>
    <form id="composerForm" class="composer-bar" autocomplete="off">
      <input id="composerInput" type="text" enterkeyhint="send" maxlength="2000" placeholder="说点什么…" />
      <button type="submit" id="composerSend">发送</button>
    </form>
  </div>

  <dialog id="settings">
    <form method="dialog" class="sheet">
      <div id="settingsMain">
        <h2>连接</h2>
        <label>Runtime WS</label>
        <input id="url" type="text" placeholder="ws://192.168.x.x:8765" />
        <label>Token（可选）</label>
        <input id="token" type="password" placeholder="token" />
        <div class="sheet-actions">
          <button type="button" id="btnNewSession" value="reset">新开会话</button>
        </div>
        <div class="sheet-actions">
          <button type="submit" id="btnSave" value="save">保存并连接</button>
          <button type="button" id="btnClose" value="cancel">关闭</button>
        </div>
      </div>
      <div id="settingsResetConfirm" hidden>
        <h2>新开会话？</h2>
        <p class="sheet-hint">会清空本设备的 Agent 对话记忆。连接不用重连。</p>
        <div class="sheet-actions">
          <button type="button" id="btnResetCancel">取消</button>
          <button type="button" id="btnResetConfirm">确定</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="./pixel-bot.js?v=4"></script>
  <script src="./app.js?v=19"></script>
</body>
</html>
