<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>AgentDock</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./icon-128.png" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="./styles.css?v=57" />
</head>
<body>
  <div class="app" id="stage" data-mood="offline">
    <main class="main">
      <div class="transcript-wrap">
        <div id="transcript" class="transcript" aria-live="polite"></div>
      </div>

      <div class="composer-dock">
        <div class="composer-pet-stack">
          <div class="status-tag" id="statusTag" aria-live="polite">
            <span id="statusLabel">未连接</span>
          </div>
          <button type="button" class="composer-pet" id="btnComposerPet" aria-label="语音输入" title="点按录音，长按打开设置">
            <canvas id="spriteComposer" class="composer-pet-canvas" width="192" height="208" aria-hidden="true"></canvas>
          </button>
        </div>
        <form id="composerForm" class="composer-bar" autocomplete="off">
          <div id="attachPreview" class="attach-preview" hidden></div>
          <div class="composer-row">
            <button type="button" id="btnAttach" class="composer-attach" aria-label="添加图片" title="添加图片">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input id="attachInput" type="file" accept="image/*" multiple hidden />
            <input id="composerInput" type="text" enterkeyhint="send" maxlength="2000" placeholder="发消息或按住说话" />
            <button type="button" id="micBtn" class="composer-mic" aria-label="语音输入" title="语音">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
            </button>
            <button type="submit" id="composerSend" class="composer-send" aria-label="发送" title="发送">
              <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <dialog id="settings">
    <form method="dialog" class="sheet">
      <div id="settingsMain">
        <h2>连接</h2>
        <label>Runtime WS</label>
        <input id="url" type="text" placeholder="ws://192.168.x.x:8765" />
        <label>Token（可选）</label>
        <input id="token" type="password" placeholder="token" />
        <div class="sheet-actions">
          <button type="submit" id="btnSave" value="save">保存并连接</button>
          <button type="button" id="btnClose" value="cancel">关闭</button>
        </div>
        <hr class="sheet-divider" />
        <button type="button" class="sheet-new" id="btnChromeNew" disabled>新开会话</button>
      </div>
      <div id="settingsResetConfirm" hidden>
        <h2>新开会话？</h2>
        <p class="sheet-hint">会清空本设备的 Agent 对话记忆与本地气泡。连接不用重连。</p>
        <div class="sheet-actions">
          <button type="button" id="btnResetCancel">取消</button>
          <button type="button" id="btnResetConfirm">确定</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="./pixel-bot.js?v=7"></script>
  <script type="module" src="./app.js?v=57"></script>
</body>
</html>
