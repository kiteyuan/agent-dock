name: agentdock_mobile
description: AgentDock thin mobile client (Device Protocol over WebSocket).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  record: 6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/status-icons.png

# Applied after `flutter create` (CI + local): brand/app-icon.png → platform launchers.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: brand/app-icon.png
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: brand/app-icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: brand/app-icon.png
