# Docker Runtime config (mounted as /app/config.yaml).
# STT defaults to CPU so Docker Desktop works without GPU passthrough.
# Default agent is mock — wire an external Agent URL when you have one.

server:
  host: "0.0.0.0"
  port: 8765
  assets_port: 8766

network:
  advertise_url: null
  assets_url: null

paths:
  home: "/data"
  vault: "vault"
  state: "state"
  logs: "logs"
  installs: "installs"
  cache: "cache"
  sessions: "sessions"
  secrets: "secrets"
  pets: "/app/assets/pets"
  voices: "/app/assets/voices"
  catalog: "catalog/catalog.yaml"

stt:
  provider: "whisper"
  warm: true
  defer_warm: true
  whisper:
    model: "small"
    device: "cpu"
    language: "zh"
    beam_size: 3
    vad_filter: true
    code_switch: false
    initial_prompt: "这是中文语音对话。常见词：技能、智能助手、编程、代码、Markdown、Agent、工具。"

session:
  max_context: 40

tts:
  default: "edge"
  warm: true
  providers:
    edge:
      type: "edge"
      name: "Edge TTS"
      voice: "zh-CN-XiaoxiaoNeural"
      models:
        - "zh-CN-XiaoxiaoNeural"
        - "zh-CN-YunxiNeural"
        - "zh-CN-XiaoyiNeural"
        - "en-US-JennyNeural"
    echo:
      type: "echo"
      name: "Echo (silent stub)"

agent:
  # Out of the box: mock (no external process).
  # Host Pi gateway: set default to "pi" and use host.docker.internal (below).
  default: "mock"
  agents:
    mock:
      type: "mock"
    echo:
      type: "echo"
    pi:
      type: "http"
      name: "Pi Coding Agent"
      # Gateway on the Docker host (Admin / python agents/pi-coding/gateway.py)
      url: "http://host.docker.internal:9001/v1/agent/run"
      mode: "stream"
      cancel_url: "http://host.docker.internal:9001/v1/agent/cancel"
      capabilities: ["coding", "bash", "filesystem"]
      timeout: 180

security:
  require_token: true
  tokens: []
