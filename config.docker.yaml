# Docker-oriented Runtime config (mounted as /app/config.yaml).
# Voices are discovered from voices/<id>/. Local speech is GPT-SoVITS inside
# the runtime network, not a host port. Agent → compose service "pi".
# STT defaults to CPU so Docker Desktop (Windows) works without GPU passthrough.
# For CUDA Whisper, prefer native .\scripts\start.ps1 on the host for now.

server:
  host: "0.0.0.0"
  port: 8765
  assets_port: 8766

network:
  advertise_url: null
  assets_url: null

pets:
  root: "pets"

workspace:
  root: "workspace"

stt:
  provider: "whisper"
  warm: true
  defer_warm: true
  whisper:
    model: "small"            # lighter default in-container; override to medium if you have RAM
    device: "cpu"
    language: "zh"
    beam_size: 3
    vad_filter: true
    code_switch: false
    initial_prompt: "这是中文语音对话。常见词：技能、智能助手、编程、代码、Markdown、Agent、工具。"

session:
  max_context: 40

tts:
  default: "edge"
  warm: true
  providers:
    edge:
      type: "edge"
      name: "Edge TTS"
      voice: "zh-CN-XiaoxiaoNeural"
      models:
        - "zh-CN-XiaoxiaoNeural"
        - "zh-CN-YunxiNeural"
        - "zh-CN-XiaoyiNeural"
        - "en-US-JennyNeural"
    echo:
      type: "echo"
      name: "Echo (silent stub)"

agent:
  default: "pi"
  agents:
    mock:
      type: "mock"
    echo:
      type: "echo"
    pi:
      type: "http"
      name: "Pi Coding Agent"
      url: "http://pi:9001/v1/agent/run"
      mode: "stream"
      cancel_url: "http://pi:9001/v1/agent/cancel"
      capabilities: ["coding", "bash", "filesystem"]
      timeout: 180

security:
  require_token: false
  tokens: []
