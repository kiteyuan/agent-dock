name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Runtime (uv · ruff · pytest · protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Locked deps + dev group; `stt` extra (faster-whisper) is lazy-imported and not needed here.
      - name: Install
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check runtime tests scripts clients/shared

      - name: Ruff format
        run: uv run ruff format --check runtime tests scripts clients/shared

      - name: Protocol codegen drift
        run: uv run python scripts/gen_protocol.py --check

      - name: Pytest
        run: uv run pytest tests -q --tb=short

  admin-ui:
    name: Admin console (tsc · eslint · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/admin/ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: runtime/admin/ui/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

  desktop:
    name: Desktop pet (checkJs · vitest · cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            runtime/admin/ui/package-lock.json

      - name: npm ci + check (desktop)
        working-directory: desktop
        run: |
          npm ci
          npm run check

      # frontendDist (../web) embeds web/console at compile time; it is gitignored, so build it first.
      - name: Build console Dist
        working-directory: desktop
        run: npm run build:console -- --force

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: cargo fmt / clippy / test
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
