name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: Runtime pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check runtime tests

      - name: Pytest
        run: python -m pytest tests -q --tb=short

  admin-ui:
    name: Admin UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/admin/ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: runtime/admin/ui/package-lock.json

      - name: Install + build
        run: |
          npm ci
          npm run build
