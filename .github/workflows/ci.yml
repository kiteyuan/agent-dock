name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: Runtime pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check runtime tests

      - name: Pytest
        run: python -m pytest tests -q --tb=short

  admin-ui:
    name: Admin UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/admin/ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: runtime/admin/ui/package-lock.json

      - name: Install + build
        run: |
          npm ci
          npm run build

      # Vite writes into runtime/admin/static — committed tree must match.
      - name: Check Admin static drift
        working-directory: ${{ github.workspace }}
        run: |
          git add -N runtime/admin/static
          if ! git diff --exit-code -- runtime/admin/static; then
            echo "::error::runtime/admin/static is out of date. Run: cd runtime/admin/ui && npm ci && npm run build, then commit static/"
            exit 1
          fi

  desktop:
    name: Desktop pet toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci (desktop)
        working-directory: desktop
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: cargo check (src-tauri)
        working-directory: desktop/src-tauri
        run: cargo check
