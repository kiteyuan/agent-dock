# AgentDock — Runtime only.
# Agents (Pi / Codex / …) and TTS engines (SoVITS) run outside this compose:
# install on the host and start via Admin, or point agent.*.url at an existing gateway.
#
#   docker compose up --build -d
#   docker compose logs -f
#
# See docs/DOCKER.md

name: agentdock

services:
  runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
    container_name: agentdock-runtime
    environment:
      PYTHONUNBUFFERED: "1"
      AGENTDOCK_HOME: "/data"
      AGENTDOCK_DOCKER: "1"
      HF_HOME: "/data/cache/huggingface"
      HF_HUB_OFFLINE: "0"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - ./assets:/app/assets:ro
      - ./catalog:/app/catalog:ro
      - ./data:/data
    ports:
      - "8765:8765"
      - "8766:8766"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
