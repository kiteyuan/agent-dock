[project]
name = "agentdock"
version = "0.1.0"
description = "Host Runtime + desk pet bridge: devices talk to agents over sessions and event streams."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "cryptography>=41.0",
    "faster-whisper>=1.0",
    "edge-tts>=7.3.1",
]

[project.optional-dependencies]
# Explicit speech extras (already covered by main deps; kept for docs / lite forks)
stt = ["faster-whisper>=1.0"]
speech = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
runtime = "runtime.main:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["runtime", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",  # line length handled by formatter / existing style
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
