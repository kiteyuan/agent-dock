[project]
name = "agentdock"
version = "0.1.0"
description = "Host Runtime + desk pet bridge: devices talk to agents over sessions and event streams."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0,<14",
    "aiohttp>=3.10,<4",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "loguru>=0.7,<1",
    "cryptography>=41.0,<47",
    "edge-tts>=7.3.1,<8",
]

[project.optional-dependencies]
# Local Whisper STT (large: ctranslate2 + onnxruntime). Default config enables it;
# lean installs set `stt.provider: none` or a remote STT.
stt = ["faster-whisper>=1.0,<2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.18",
    "ruff==0.16.5",
    "pre-commit>=4.0",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
runtime = "runtime.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["runtime", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
    "E501",  # line length handled by formatter / existing style
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
