<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#f5f5f6" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <title>AgentDock 控制台</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f5f5f6; }
      #boot { padding: 1.25rem 1.5rem; color: #71717a; font: 14px/1.5 system-ui, sans-serif; }
      #root:not(:empty) ~ #boot { display: none; }
    </style>
    <script>
      (function () {
        try {
          var m = localStorage.getItem("agentdock-admin-theme");
          if (m !== "light" && m !== "dark") m = "light";
          document.documentElement.setAttribute("data-theme", m);
          document.documentElement.style.colorScheme = m;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">正在加载控制台…</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
