[[permission]]
identifier = "allow-local-device-token"
description = "Read local Runtime device token from device-auth.json"
commands.allow = ["local_device_token"]

[[permission]]
identifier = "allow-fit-pet-window"
description = "Resize the pet window to hug the character"
commands.allow = ["fit_pet_window"]

[[permission]]
identifier = "allow-open-admin-panel"
description = "Open the Admin console as a second App window"
commands.allow = ["open_admin_panel"]

[[permission]]
identifier = "allow-admin-api"
description = "Proxy Admin /api requests to local Runtime loopback"
commands.allow = ["admin_api"]

[[permission]]
identifier = "allow-shutdown-host"
description = "Stop Runtime stack and exit the desk pet (stop.ps1-like)"
commands.allow = ["shutdown_host"]

[[permission]]
identifier = "allow-start-pet-drag"
description = "Start dragging the main pet window explicitly"
commands.allow = ["start_pet_drag"]

[[permission]]
identifier = "allow-pet-window-pos"
description = "Get/set main pet window position for smooth manual drag"
commands.allow = ["pet_window_pos", "set_pet_window_pos"]

[[permission]]
identifier = "allow-pet-hit-rects"
description = "Report interactive regions so the transparent window area is click-through"
commands.allow = ["set_pet_hit_rects"]

[[permission]]
identifier = "allow-secure-device-token"
description = "Read/write device WS token in the OS keyring"
commands.allow = [
  "secure_device_token_get",
  "secure_device_token_set",
  "secure_device_token_clear",
]
