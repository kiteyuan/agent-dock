schema_version: 2

# Built-in assistant: Pi Coding, vendored under agents/pi-coding.
# Runtime ensures `npm install` there on first start — no global CLI required.

sidecars:
  pi:
    name: Pi Coding Gateway
    port: 9001
    spawn:
      executable: "{python}"
      args: ["agents/pi-coding/gateway.py"]
      cwd: "."
      env: {PI_GATEWAY_PORT: "{port}"}
    health: {kind: http, url: "http://127.0.0.1:9001/v1/agent"}

modules:
  - id: pi
    name: Pi Coding
    kind: agent
    registry_id: pi
    sidecar_id: pi
    version: repository
    homepage: https://pi.dev/
    dependencies: [node, npm]
    # Prefer bundled install; PATH `pi` is optional.
    health: {kind: command, command: pi}
    local_marker: agents/pi-coding/node_modules
    install:
      kind: npm
      cwd: agents/pi-coding
    licenses:
      - {id: mit, name: MIT, url: "https://opensource.org/license/mit"}
      - {id: workspace-execution, name: Workspace Tool Execution, url: "https://pi.dev/docs/latest", requires_acceptance: true, redistributable: false}
    capabilities: {streaming: true, local: true, cpu: true}
    configuration:
      mode: model
      help_url: https://pi.dev/
      providers:
        - {id: anthropic, name: Anthropic, credential_env: ANTHROPIC_API_KEY, model_env: PI_MODEL, extra_env: {PI_PROVIDER: anthropic}}
        - {id: deepseek, name: DeepSeek, credential_env: DEEPSEEK_API_KEY, model_env: PI_MODEL, default_base_url: "https://api.deepseek.com", default_model: deepseek-flash, extra_env: {PI_PROVIDER: deepseek}}
        - {id: openai, name: OpenAI 兼容服务, credential_env: OPENAI_API_KEY, base_url_env: OPENAI_BASE_URL, model_env: PI_MODEL, extra_env: {PI_PROVIDER: openai}}
    description: 项目内置编码助手（agents/pi-coding）；首启自动 npm install，配置 API Key 后即可使用
