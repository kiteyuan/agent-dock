      - {id: workspace-execution, name: Headless Workspace Execution, url: "https://docs.openhands.dev/openhands/usage/cli/headless", requires_acceptance: true, redistributable: false}
    hardware: {platforms: [linux, darwin], min_ram_gb: 8, min_disk_gb: 3}
    capabilities: {streaming: true, local: true, cpu: true}
