schema_version: 2

sidecars:
  pi:
    name: Pi Coding Gateway
    port: 9001
    spawn:
      executable: "{python}"
      args: ["agents/pi-coding/gateway.py"]
      cwd: "."
      env: {PI_GATEWAY_PORT: "{port}"}
    health: {kind: http, url: "http://127.0.0.1:9001/v1/agent"}
  codex:
    name: Codex Gateway
    port: 9002
    spawn:
      executable: "{python}"
      args: ["agents/codex/gateway.py"]
      cwd: "."
      env: {CODEX_GATEWAY_PORT: "{port}"}
    health: {kind: http, url: "http://127.0.0.1:9002/v1/agent"}
  claude:
    name: Claude Gateway
    port: 9003
    spawn:
      executable: "{python}"
      args: ["agents/claude-code/gateway.py"]
      cwd: "."
      env: {CLAUDE_GATEWAY_PORT: "{port}"}
    health: {kind: http, url: "http://127.0.0.1:9003/v1/agent"}
  opencode:
    name: OpenCode Gateway
    port: 9004
    spawn: &generic_agent
      executable: "{python}"
      args: ["agents/gateway.py", "--driver", "opencode", "--port", "{port}"]
      cwd: "."
      env: {AGENTDOCK_MODULE_BIN: "{module_bin}"}
    health: {kind: http, url: "http://127.0.0.1:9004/v1/agent"}
  cline:
    name: Cline Gateway
    port: 9005
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "cline", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9005/v1/agent"}
  openhands:
    name: OpenHands Gateway
    port: 9006
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "openhands", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9006/v1/agent"}
  goose:
    name: Goose Gateway
    port: 9007
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "goose", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9007/v1/agent"}
  aider:
    name: Aider Gateway
    port: 9008
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "aider", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9008/v1/agent"}
  qwen-code:
    name: Qwen Code Gateway
    port: 9009
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "qwen-code", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9009/v1/agent"}
  kimi-code:
    name: Kimi Code Gateway
    port: 9010
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "kimi-code", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9010/v1/agent"}
  codebuddy:
    name: CodeBuddy Gateway
    port: 9011
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "codebuddy", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9011/v1/agent"}
  qoder:
    name: Qoder Gateway
    port: 9012
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "qoder", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9012/v1/agent"}
  hermes:
    name: Hermes Gateway
    port: 9013
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "hermes", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9013/v1/agent"}
  gemini:
    name: Gemini Gateway
    port: 9014
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "gemini", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9014/v1/agent"}
  crush:
    name: Crush Gateway
    port: 9015
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "crush", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9015/v1/agent"}
  amp:
    name: Amp Gateway
    port: 9016
    spawn:
      <<: *generic_agent
      args: ["agents/gateway.py", "--driver", "amp", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9016/v1/agent"}

modules:
  - id: pi
    name: Pi Coding
    kind: agent
    registry_id: pi
    sidecar_id: pi
    version: repository
    homepage: https://pi.dev/
    dependencies: [node, npm]
    health: {kind: command, command: pi}
    local_marker: agents/pi-coding/node_modules
    licenses:
      - {id: mit, name: MIT, url: "https://opensource.org/license/mit"}
      - {id: workspace-execution, name: Workspace Tool Execution, url: "https://pi.dev/docs/latest", requires_acceptance: true, redistributable: false}
    capabilities: {streaming: true, local: true, cpu: true}
    configuration:
      mode: model
      help_url: https://pi.dev/
      providers:
        - {id: anthropic, name: Anthropic, credential_env: ANTHROPIC_API_KEY, model_env: PI_MODEL, extra_env: {PI_PROVIDER: anthropic}}
        # Native DeepSeek provider (openai-completions). Do NOT map DeepSeek through
        # generic openai — Pi then uses openai-responses and times out against api.deepseek.com.
        - {id: deepseek, name: DeepSeek, credential_env: DEEPSEEK_API_KEY, model_env: PI_MODEL, default_base_url: "https://api.deepseek.com", default_model: deepseek-flash, extra_env: {PI_PROVIDER: deepseek}}
        - {id: openai, name: OpenAI 兼容服务, credential_env: OPENAI_API_KEY, base_url_env: OPENAI_BASE_URL, model_env: PI_MODEL, extra_env: {PI_PROVIDER: openai}}
    description: 精简、可扩展的本地编码 Agent
  - id: codex
    name: OpenAI Codex
    kind: agent
    registry_id: codex
    sidecar_id: codex
    version: external
    homepage: https://developers.openai.com/codex/cli
    dependencies: [codex-cli]
    health: {kind: command, command: codex}
    licenses:
      - {id: apache-2.0, name: Apache-2.0, url: "https://www.apache.org/licenses/LICENSE-2.0"}
      - {id: workspace-execution, name: Workspace Tool Execution, url: "https://developers.openai.com/codex/config-advanced", requires_acceptance: true, redistributable: false}
    capabilities: {streaming: true, local: true, cpu: true}
    configuration:
      mode: model
      help_url: https://developers.openai.com/codex/cli
      providers:
        - {id: openai, name: OpenAI 账号或 API, credential_label: API Key（可留空使用已登录账号）, credential_env: OPENAI_API_KEY, credential_required: false, model_env: CODEX_MODEL, model_required: false}
    description: OpenAI 官方沙箱编码 Agent
  - id: claude
    name: Claude Code
    kind: agent
    registry_id: claude
    sidecar_id: claude
    version: external
    homepage: https://code.claude.com/docs/en/setup
    dependencies: [claude-cli]
    health: {kind: command, command: claude}
    licenses:
      - {id: anthropic-commercial, name: Anthropic Commercial Terms, url: "https://www.anthropic.com/legal/commercial-terms", requires_acceptance: true, redistributable: false}
      - {id: workspace-execution, name: Workspace Tool Execution, url: "https://docs.anthropic.com/en/docs/claude-code/security", requires_acceptance: true, redistributable: false}
    capabilities: {streaming: true, local: true, cpu: true}
    configuration:
      mode: model
      help_url: https://code.claude.com/docs
      providers:
        - {id: anthropic, name: Anthropic 账号或 API, credential_label: API Key（可留空使用已登录账号）, credential_env: ANTHROPIC_API_KEY, credential_required: false, base_url_env: ANTHROPIC_BASE_URL, model_env: CLAUDE_MODEL, model_required: false}
    description: Anthropic 官方编码 Agent
  - id: opencode
    name: OpenCode
    kind: agent
    registry_id: opencode
    sidecar_id: opencode
    version: 1.18.31
    homepage: https://opencode.ai/download
    dependencies: [node, npm]
    health: {kind: command, command: opencode}
    licenses:
      - {id: mit, name: MIT, url: "https://opensource.org/license/mit"}
      - {id: workspace-execution, name: Workspace Tool Execution, url: "https://opencode.ai/docs/permissions/", requires_acceptance: true, redistributable: false}
    capabilities: {streaming: true, local: true, cpu: true}
    configuration:
      mode: model
      help_url: https://opencode.ai/docs/providers/
      providers:
        - {id: openai, name: OpenAI 兼容服务, credential_env: OPENAI_API_KEY, base_url_env: OPENAI_BASE_URL}
        - {id: anthropic, name: Anthropic, credential_env: ANTHROPIC_API_KEY, base_url_env: ANTHROPIC_BASE_URL}
        - {id: openrouter, name: OpenRouter, credential_env: OPENROUTER_API_KEY, default_base_url: "https://openrouter.ai/api/v1"}
    description: 多模型、多 Provider 的开源终端 Agent
  - id: cline
    name: Cline
