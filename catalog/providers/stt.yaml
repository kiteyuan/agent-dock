schema_version: 2

sidecars:
  sensevoice:
    name: SenseVoice Engine
    port: 9891
    spawn: &stt_sidecar
      executable: "{module_python}"
      args: ["-m", "runtime.transport.speech.sidecar", "--provider", "sensevoice", "--mode", "stt", "--port", "{port}"]
      cwd: "{root}"
      env: {PYTHONPATH: "{root}"}
    health: {kind: http, url: "http://127.0.0.1:9891/health"}
  funasr:
    name: FunASR Engine
    port: 9892
    spawn:
      <<: *stt_sidecar
      args: ["-m", "runtime.transport.speech.sidecar", "--provider", "funasr", "--mode", "stt", "--port", "{port}"]
    health: {kind: http, url: "http://127.0.0.1:9892/health"}

modules:
  - id: whisper
    name: Faster Whisper
    kind: stt
    registry_id: whisper
    version: runtime
    homepage: https://github.com/SYSTRAN/faster-whisper
    dependencies: [faster-whisper]
    licenses:
      - {id: mit, name: MIT, url: "https://opensource.org/license/mit"}
    hardware: {min_ram_gb: 4, min_disk_gb: 3, min_vram_gb: 2, gpu_recommended: true}
    capabilities: {languages: [multilingual], streaming: false, local: true, cpu: true, gpu: true}
    description: 覆盖语言最广的本地识别默认项
  - id: sensevoice
    name: SenseVoice
    kind: stt
    registry_id: sensevoice
    sidecar_id: sensevoice
    version: funasr-1.4.15
    homepage: https://github.com/FunAudioLLM/SenseVoice
    dependencies: [python]
    install:
      kind: steps
      steps:
        - {kind: venv}
        - {kind: command, executable: "{module_python}", args: ["-m", "runtime.transport.speech.ensure_torch"], cwd: "."}
        - {kind: pip, packages: ["funasr==1.4.15", "modelscope>=1.20,<2"]}
        - {kind: command, executable: "{module_python}", args: ["-m", "runtime.transport.speech.prefetch", "--provider", "sensevoice", "--module-dir", "{module_dir}"], cwd: "."}
    licenses:
      - {id: sensevoice-model, name: SenseVoice Model License, url: "https://modelscope.cn/models/iic/SenseVoiceSmall", requires_acceptance: true, redistributable: false}
    hardware: {min_ram_gb: 4, min_disk_gb: 3}
    capabilities: {languages: [zh, en, ja, ko, yue], streaming: false, local: true, cpu: true, gpu: true}
    description: 中文、粤语、情绪与音频事件识别优先
  - id: funasr
    name: FunASR
    kind: stt
    registry_id: funasr
    sidecar_id: funasr
    version: 1.4.15
    homepage: https://github.com/modelscope/FunASR
    dependencies: [python]
    install:
      kind: steps
      steps:
        - {kind: venv}
        - {kind: command, executable: "{module_python}", args: ["-m", "runtime.transport.speech.ensure_torch"], cwd: "."}
        - {kind: pip, packages: ["funasr==1.4.15", "modelscope>=1.20,<2"]}
        - {kind: command, executable: "{module_python}", args: ["-m", "runtime.transport.speech.prefetch", "--provider", "funasr", "--module-dir", "{module_dir}"], cwd: "."}
    licenses:
      - {id: mit, name: MIT, url: "https://opensource.org/license/mit"}
      - {id: paraformer-model, name: Paraformer Model Terms, url: "https://modelscope.cn/models/iic/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch", requires_acceptance: true, redistributable: false}
    hardware: {min_ram_gb: 6, min_disk_gb: 5, min_vram_gb: 2, gpu_recommended: true}
    capabilities: {languages: [zh, en, multilingual], streaming: true, local: true, cpu: true, gpu: true}
    description: 中文工业级 ASR、VAD 与标点流水线
