schema_version: 2
provider_glob: "providers/*.yaml"

# Module source of truth for installable capabilities (agents / TTS / STT / pets).
# Runtime defaults and ports still come from config.yaml (+ config.local.yaml);
# Admin selections persist under data/state/.
#
# Pi is the only built-in coding assistant. Speech / pets remain optional modules.
enabled:
  - pi
  - edge
  - gpt-sovits
  - whisper
  - sensevoice
  - funasr
  - pets

sidecars:
  runtime:
    name: Runtime WebSocket
    port: 8765
    managed: false
    health: {kind: tcp, port: 8765}
  admin:
    name: Admin / Pets HTTP
    port: 8766
    managed: false
    health: {kind: tcp, port: 8766}
